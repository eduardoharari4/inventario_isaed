<div class="header-row">
  <h2>Clientes</h2>
  <button mat-flat-button color="primary" (click)="abrirNuevo()">
    <mat-icon>add</mat-icon>
    Nuevo cliente
  </button>
</div>

<mat-form-field appearance="outline" class="filtro">
  <mat-label>Buscar por nombre</mat-label>
  <input matInput [(ngModel)]="filtro" />
</mat-form-field>

@if (cargando()) {
  <p>Cargando...</p>
} @else if (clientesFiltrados().length === 0) {
  <p>No hay clientes registrados.</p>
} @else {
  <div class="tabla-scroll">
    <table mat-table [dataSource]="clientesFiltrados()">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">{{ c.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="ciudad">
        <th mat-header-cell *matHeaderCellDef>Ciudad</th>
        <td mat-cell *matCellDef="let c">{{ c.ciudad }}</td>
      </ng-container>

      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let c">{{ c.telefono }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c">
          <button mat-icon-button (click)="editar(c)" aria-label="Editar cliente">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="eliminar(c)" aria-label="Borrar cliente">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>
  </div>
}
