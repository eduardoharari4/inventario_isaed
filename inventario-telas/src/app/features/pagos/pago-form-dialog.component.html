<h2 mat-dialog-title>Registrar pago — {{ data.clienteNombre }}</h2>
<mat-dialog-content>
  <form class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Monto</mat-label>
      <input matInput type="number" min="0.01" step="0.01" [(ngModel)]="monto" name="monto" required />
      <span matTextPrefix>$&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha</mat-label>
      <input matInput type="date" [(ngModel)]="fecha" name="fecha" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Forma de pago</mat-label>
      <input matInput [(ngModel)]="formaPago" name="formaPago" placeholder="ej. Efectivo, transferencia" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nota (opcional)</mat-label>
      <input matInput [(ngModel)]="nota" name="nota" />
    </mat-form-field>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="guardando()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()" [disabled]="guardando()">Guardar</button>
</mat-dialog-actions>
