<mat-sidenav-container class="shell-container">
  <mat-sidenav
    #drawer
    class="shell-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <mat-nav-list>
      <a mat-list-item routerLink="/remisiones" routerLinkActive="active-link" (click)="closeIfHandset(drawer)">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Remisiones</span>
      </a>
      <a mat-list-item routerLink="/telas" routerLinkActive="active-link" (click)="closeIfHandset(drawer)">
        <mat-icon matListItemIcon>checkroom</mat-icon>
        <span matListItemTitle>Telas e inventario</span>
      </a>
      <a mat-list-item routerLink="/clientes" routerLinkActive="active-link" (click)="closeIfHandset(drawer)">
        <mat-icon matListItemIcon>groups</mat-icon>
        <span matListItemTitle>Clientes</span>
      </a>
      @if (auth.isAdmin()) {
        <a mat-list-item routerLink="/reportes" routerLinkActive="active-link" (click)="closeIfHandset(drawer)">
          <mat-icon matListItemIcon>insights</mat-icon>
          <span matListItemTitle>Reporte del negocio</span>
        </a>
        <a mat-list-item routerLink="/saldos" routerLinkActive="active-link" (click)="closeIfHandset(drawer)">
          <mat-icon matListItemIcon>account_balance_wallet</mat-icon>
          <span matListItemTitle>Saldos de clientes</span>
        </a>
        <a mat-list-item routerLink="/empresa" routerLinkActive="active-link" (click)="closeIfHandset(drawer)">
          <mat-icon matListItemIcon>store</mat-icon>
          <span matListItemTitle>Datos de la empresa</span>
        </a>
        <a mat-list-item routerLink="/usuarios" routerLinkActive="active-link" (click)="closeIfHandset(drawer)">
          <mat-icon matListItemIcon>manage_accounts</mat-icon>
          <span matListItemTitle>Usuarios</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="shell-toolbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="brand"><mat-icon>checkroom</mat-icon> Inventario de Telas</span>
      <span class="spacer"></span>
      <span class="usuario">{{ auth.profile()?.nombre }}</span>
      <button mat-icon-button (click)="logout()" aria-label="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="shell-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
